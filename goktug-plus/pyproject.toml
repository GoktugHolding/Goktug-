[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goktug-plus"
version = "1.0.0"
description = "Türkçe sözdizimli, Python çalışma zamanı tabanlı programlama dili"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Goktug+ contributors"}]
keywords = ["programming-language", "Turkish", "interpreter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.scripts]
trp = "goktug.cli:main"
tpg = "goktug.package_manager:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
